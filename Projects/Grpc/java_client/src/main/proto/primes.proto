syntax = "proto3";

package primes;

option java_multiple_files = true;
option java_package = "tn.ensi.primes";

// Service sur les nombres premiers
service PrimeService {
  // Appel normal (Requête/Réponse) : n est-il premier ? sinon sa factorisation
  rpc IsPrime (NumberRequest) returns (IsPrimeResponse);

  // Diffusion (Stream) serveur -> client : les n premiers nombres premiers
  rpc FirstPrimes (NumberRequest) returns (stream PrimeReply);
}

message NumberRequest {
  int64 n = 1;
}

message IsPrimeResponse {
  bool is_prime = 1;
  repeated int64 factors = 2;   // vide si n est premier
}

message PrimeReply {
  int64 prime = 1;
}
